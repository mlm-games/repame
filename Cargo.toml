[workspace]
resolver = "3"
members = ["crates/*"]
default-members = [
  "crates/repame-*",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MPL-2.0"
repository = "https://github.com/mlm-games/repame"
rust-version = "1.98"

[workspace.dependencies]
bevy_ecs = "0.19"
# Repose UI shell (incl. the `gamepad` backend).
repose-core = "0.30"
repose-ui = "0.30"
repose-material = "0.30"
repose-canvas = "0.30"
repose-docking = "0.30"
repose-platform = "0.30"
repose-render-wgpu = "0.30"
repose-text = "0.30"
repose-app = "0.30"
repose-tree = "0.30"
wgpu = "30"
glam = "0.33"
bytemuck = { version = "1", features = ["derive"] }
cpal = "0.18"
symphonia = { version = "0.6", features = ["all"] }
web-workers = "0.3"
anyhow = "1"
log = "0.4"
web-time = "1"
rand = "0.10"
noise = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.4"
wasm-bindgen = "0.2"
winit = "0.30"
renamite-player = { version = "0.2" }
renamite-player-ui = { version = "0.2" }

repame-sim = { path = "crates/repame-sim", version = "0.2.0" }
repame-atlas = { path = "crates/repame-atlas", version = "0.2.0" }
repame-anim = { path = "crates/repame-anim", version = "0.2.0" }
repame-audio = { path = "crates/repame-audio", version = "0.2.0" }
repame-sprite = { path = "crates/repame-sprite", version = "0.2.0" }
repame-shell = { path = "crates/repame-shell", version = "0.2.0" }
repame-actors = { path = "crates/repame-actors", version = "0.2.0" }
repame-fx = { path = "crates/repame-fx", version = "0.2.0" }
repame-input = { path = "crates/repame-input", version = "0.2.0" }

# renamite-player = { path = "../renamite/crates/renamite-player"}
# renamite-player-ui = { path = "../renamite/crates/renamite-player-ui"}
