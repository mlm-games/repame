[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/*"]

[workspace.package]
version = "0.1.6"
edition = "2024"
license = "MPL-2.0"
repository = "https://github.com/mlm-games/repame"
rust-version = "1.98"

[workspace.dependencies]
bevy_ecs = "0.19"
# Repose UI shell (incl. the `gamepad` backend).
repose-core = "0.29"
repose-ui = "0.29"
repose-material = "0.29"
repose-canvas = "0.29"
repose-docking = "0.29"
repose-platform = "0.29"
repose-render-wgpu = "0.29"
repose-text = "0.29"
repose-app = "0.29"
repose-tree = "0.29"
wgpu = "30"
glam = "0.33"
bytemuck = { version = "1", features = ["derive"] }
gilrs = "0.11"
kira = "0.12"
cpal = "0.18"
symphonia = { version = "0.6", features = ["all"] }
web-workers = "0.3"
anyhow = "1"
log = "0.4"
web-time = "1"
rand = "0.10"
noise = "0.9"
serde = { version = "1", features = ["derive"] }
renamite-player = { version = "0.2" }
renamite-player-ui = { version = "0.2" }

repame-sim = { path = "crates/repame-sim", version = "0.1" }
repame-atlas = { path = "crates/repame-atlas", version = "0.1" }
repame-audio = { path = "crates/repame-audio", version = "0.1" }
repame-sprite = { path = "crates/repame-sprite", version = "0.1" }
repame-shell = { path = "crates/repame-shell", version = "0.1" }

# renamite-player = { path = "../renamite/crates/renamite-player", version = "0.2" }
# renamite-player-ui = { path = "../renamite/crates/renamite-player-ui", version = "0.2" }
