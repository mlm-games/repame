[workspace]
resolver = "3"
members = ["crates/*"]
default-members = [
  "crates/repame-*",
]

[workspace.package]
version = "0.2.2"
edition = "2024"
license = "MPL-2.0"
repository = "https://github.com/mlm-games/repame"
rust-version = "1.98"

[workspace.dependencies]
bevy_ecs = "0.19"
gltf = { version = "1.4", default-features = false, features = ["utils", "import", "names", "KHR_materials_unlit", "KHR_materials_emissive_strength", "KHR_texture_transform"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
# Repose UI shell (incl. the `gamepad` backend).
repose-core = { version = "0.30", features = ["serde"] }
repose-ui = { version = "0.30" }
repose-material = { version = "0.30" }
repose-canvas = { version = "0.30" }
repose-docking = { version = "0.30" }
repose-platform = { version = "0.30" }
repose-render-wgpu = { version = "0.30" }
repose-text = { version = "0.30" }
repose-app = { version = "0.30" }
repose-tree = { version = "0.30" }
wgpu = "30"
glam = "0.33"
bytemuck = { version = "1", features = ["derive"] }
cpal = "0.18"
symphonia = { version = "0.6", features = ["all"] }
web-workers = "0.3"
anyhow = "1"
log = "0.4"
web-time = "1"
rand = "0.10"
noise = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.4"
wasm-bindgen = "0.2"
winit = "0.30"
renamite-player = { version = "0.3" }
renamite-player-ui = { version = "0.3" }
renamite-render-bridge = { version = "0.3" }

repame-sim = { path = "crates/repame-sim", version = "0.2.2" }
repame-view3d = { path = "crates/repame-view3d", version = "0.2.2" }
repame-atlas = { path = "crates/repame-atlas", version = "0.2.2" }
repame-anim = { path = "crates/repame-anim", version = "0.2.2" }
repame-audio = { path = "crates/repame-audio", version = "0.2.2" }
repame-sprite = { path = "crates/repame-sprite", version = "0.2.2" }
repame-shell = { path = "crates/repame-shell", version = "0.2.2" }
repame-actors = { path = "crates/repame-actors", version = "0.2.2" }
repame-fx = { path = "crates/repame-fx", version = "0.2.2" }
repame-input = { path = "crates/repame-input", version = "0.2.2" }
repame-physics = { path = "crates/repame-physics", version = "0.2.2" }
repame-rapier2d = { path = "crates/repame-rapier2d", version = "0.2.2" }
repame-rapier3d = { path = "crates/repame-rapier3d", version = "0.2.2" }


