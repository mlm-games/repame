# repose-app = { path = "../repose/crates/repose-app" }
# repose-platform = { path = "../repose/crates/repose-platform" }
# repose-tree = { path = "../repose/crates/repose-tree" }
# repose-devtools = { path = "../repose/crates/repose-devtools" }
# repose-navigation = { path = "../repose/crates/repose-navigation" }
# repose-material = { path = "../repose/crates/repose-material" }
# repose-docking = { path = "../repose/crates/repose-docking" }
# Same temporary override as the repose workspace has: a dependency's own
# [patch] is ignored, so repame must repeat it for the local rlobkit. Drop
