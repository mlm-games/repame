[workspace]
resolver = "3"
members = ["crates/*"]
default-members = [
  "crates/repame-*",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MPL-2.0"
repository = "https://github.com/mlm-games/repame"
rust-version = "1.98"

[workspace.dependencies]
bevy_ecs = "0.19"
# Repose UI shell (incl. the `gamepad` backend).
repose-core = { path = "../repose/crates/repose-core", version = "0.30", features = ["serde"] }
repose-ui = { path = "../repose/crates/repose-ui", version = "0.30" }
repose-material = { path = "../repose/crates/repose-material", version = "0.30" }
repose-canvas = { path = "../repose/crates/repose-canvas", version = "0.30" }
repose-docking = { path = "../repose/crates/repose-docking", version = "0.30" }
repose-platform = { path = "../repose/crates/repose-platform", version = "0.30" }
repose-render-wgpu = { path = "../repose/crates/repose-render-wgpu", version = "0.30" }
repose-text = { path = "../repose/crates/repose-text", version = "0.30" }
repose-app = { path = "../repose/crates/repose-app", version = "0.30" }
repose-tree = { path = "../repose/crates/repose-tree", version = "0.30" }
wgpu = "30"
glam = "0.33"
bytemuck = { version = "1", features = ["derive"] }
cpal = "0.18"
symphonia = { version = "0.6", features = ["all"] }
web-workers = "0.3"
anyhow = "1"
log = "0.4"
web-time = "1"
rand = "0.10"
noise = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.4"
wasm-bindgen = "0.2"
winit = "0.30"
renamite-player = { path = "../renamite/crates/renamite-player", version = "0.2" }
renamite-player-ui = { path = "../renamite/crates/renamite-player-ui", version = "0.2" }
renamite-render-bridge = { path = "../renamite/crates/renamite-render-bridge", version = "0.2" }

repame-sim = { path = "crates/repame-sim", version = "0.2.0" }
repame-view3d = { path = "crates/repame-view3d", version = "0.2.0" }
repame-atlas = { path = "crates/repame-atlas", version = "0.2.0" }
repame-anim = { path = "crates/repame-anim", version = "0.2.0" }
repame-audio = { path = "crates/repame-audio", version = "0.2.0" }
repame-sprite = { path = "crates/repame-sprite", version = "0.2.0" }
repame-shell = { path = "crates/repame-shell", version = "0.2.0" }
repame-actors = { path = "crates/repame-actors", version = "0.2.0" }
repame-fx = { path = "crates/repame-fx", version = "0.2.0" }
repame-input = { path = "crates/repame-input", version = "0.2.0" }

# renamite-player = { version = "0.2" }
# renamite-player-ui = { version = "0.2" }
